<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oggo</title>
    <script src="/vendor/tailwindcss.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              'bg': '#09090E',
              'bg2': '#0F0F17',
              'bg3': '#14141E',
              'bg4': '#1A1A26',
              'bg5': '#20202E',
              'ac': '#F97316',
              'ok': '#22C55E',
              'er': '#EF4444',
              'warn': '#F59E0B',
              'info': '#3B82F6',
              't1': '#E8E8F0',
              't2': '#8888A0',
              't3': '#4A4A62',
            },
            fontFamily: {
              'sans': ['Space Grotesk', 'system-ui', 'sans-serif'],
              'mono': ['JetBrains Mono', 'monospace'],
            },
            borderRadius: {
              'xl2': '16px',
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/vendor/file-icons-js/css/style.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-gray-50 dark:bg-[#0a0a0f] text-gray-900 dark:text-gray-100">
    <div class="min-h-screen flex">
      <aside id="nav-shell" class="hidden md:flex border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-[#111118]">
        <div id="nav-rail" class="w-[52px] border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-[#0f1118] flex flex-col items-center py-2 gap-1">
          <button class="rail-btn mb-2" data-rail-section="dashboard" data-tooltip="Oggo">
            <span class="rail-icon-bg"><i data-lucide="clock" class="w-4 h-4"></i></span>
          </button>
          <button class="rail-btn" data-rail-section="dashboard" data-tooltip="Dashboard"><span class="rail-icon-bg"><i data-lucide="layout-dashboard" class="w-4 h-4"></i></span></button>
          <button class="rail-btn" data-rail-section="jobs" data-tooltip="Jobs"><span class="rail-icon-bg"><i data-lucide="clock-3" class="w-4 h-4"></i></span></button>
          <button class="rail-btn" data-rail-section="logs" data-tooltip="Logs"><span class="rail-icon-bg"><i data-lucide="file-text" class="w-4 h-4"></i></span></button>
          <div class="rail-separator"></div>
          <button class="rail-btn" data-rail-section="servers" data-tooltip="Servers"><span class="rail-icon-bg"><i data-lucide="server" class="w-4 h-4"></i></span><span id="rail-dot-servers" class="rail-dot hidden"></span></button>
          <button class="rail-btn" data-rail-section="software" data-tooltip="Software"><span class="rail-icon-bg"><i data-lucide="package" class="w-4 h-4"></i></span></button>
          <button class="rail-btn" data-rail-section="storage" data-tooltip="Storage"><span class="rail-icon-bg"><i data-lucide="database" class="w-4 h-4"></i></span></button>
          <button class="rail-btn" data-rail-section="developer-tools" data-tooltip="Developer Tools"><span class="rail-icon-bg"><i data-lucide="code-2" class="w-4 h-4"></i></span><span id="rail-dot-devtools" class="rail-dot hidden"></span></button>
          <button class="rail-btn" data-rail-section="vault" data-tooltip="Vault"><span class="rail-icon-bg"><i data-lucide="key-round" class="w-4 h-4"></i></span><span id="rail-dot-vault" class="rail-dot hidden"></span></button>
          <button class="rail-btn" data-rail-section="aws" data-tooltip="AWS Services"><span class="rail-icon-bg"><i data-lucide="box" class="w-4 h-4"></i></span><span id="rail-dot-aws" class="rail-dot hidden"></span></button>
          <div class="flex-1"></div>
          <div class="rail-separator"></div>
          <button class="rail-btn" data-rail-section="settings" data-tooltip="Settings"><span class="rail-icon-bg"><i data-lucide="settings" class="w-4 h-4"></i></span></button>
        </div>
        <div id="nav-context" class="w-[200px] context-panel transition-all duration-200">
          <div id="context-title" class="context-title"></div>
          <div id="context-list" class="space-y-1"></div>
        </div>
      </aside>

      <main class="flex-1">
        <header class="h-16 border-b border-gray-200 dark:border-gray-800 px-4 flex items-center justify-between bg-white dark:bg-[#111118]">
          <div class="flex items-center gap-3">
            <span id="top-breadcrumb" class="text-sm text-gray-500 dark:text-gray-400">Dashboard / Dashboard</span>
            <select id="top-workspace-switcher" class="hidden input !py-1 !px-2 text-xs min-w-[180px]"></select>
          </div>
          <div class="flex items-center space-x-4">
            <button id="global-search-btn" class="text-gray-500 hover:text-orange-500 transition-colors inline-flex items-center gap-1 text-xs" title="Search (Ctrl+K / Cmd+K)">
              <i data-lucide="search" class="w-4 h-4"></i>
              <span class="hidden md:inline">Ctrl+K</span>
            </button>
            <button id="server-restart-btn" class="text-gray-500 hover:text-orange-500 transition-colors" title="Restart Server">
              <i data-lucide="rotate-cw" class="w-5 h-5"></i>
            </button>
            <button id="server-stop-btn" class="text-gray-500 hover:text-red-500 transition-colors" title="Stop Server">
              <i data-lucide="power" class="w-5 h-5"></i>
            </button>
            <button id="theme-toggle" class="text-gray-500 hover:text-gray-900 dark:hover:text-gray-100 transition-colors">
              <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
              <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
            </button>
          </div>
        </header>
        <section id="app-content" class="p-4 md:p-6"></section>
      </main>
    </div>

    <div id="job-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 w-full max-w-2xl">
        <h3 class="text-lg font-semibold mb-3">Job</h3>
        <div id="job-modal-body"></div>
      </div>
    </div>

    <div id="sudo-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[80]">
      <div class="w-full max-w-md bg-[var(--bg3)] border border-[var(--b)] rounded-xl overflow-hidden">
        <div class="px-4 py-3 border-b border-[var(--b)] flex items-center justify-between">
          <div class="text-[13px] font-semibold text-[var(--t)]">Elevated permissions</div>
          <button id="sudo-close" class="w-7 h-7 rounded-md border border-[var(--b)] text-[var(--t3)] hover:bg-[var(--bg4)] hover:text-[var(--t2)] transition-colors">×</button>
        </div>
        <div class="p-4 space-y-3">
          <div>
            <label class="block text-[11px] text-[var(--t2)] font-medium mb-1">Run as user</label>
            <input id="sudo-user" class="w-full bg-[var(--bg4)] border border-[var(--b2)] rounded-lg px-3 py-2 text-[12.5px] text-[var(--t)] font-mono outline-none focus:border-[var(--ac)]" placeholder="root (optional)" />
            <div class="text-[11px] text-[var(--t3)] mt-1">Leave empty to use default sudo user.</div>
          </div>
          <div>
            <label class="block text-[11px] text-[var(--t2)] font-medium mb-1">Sudo password</label>
            <input id="sudo-password" type="password" class="w-full bg-[var(--bg4)] border border-[var(--b2)] rounded-lg px-3 py-2 text-[12.5px] text-[var(--t)] font-mono outline-none focus:border-[var(--ac)]" placeholder="••••••••" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button id="sudo-cancel" class="px-3 py-2 rounded-lg border border-[var(--b)] text-[12px] text-[var(--t2)] hover:bg-[var(--bg4)] transition-colors">Cancel</button>
            <button id="sudo-confirm" class="px-3 py-2 rounded-lg bg-[var(--ac)] text-white text-[12px] font-medium hover:opacity-90 transition-opacity">Continue</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
    <div id="global-search-overlay" class="hidden fixed inset-0 z-[70] bg-black/40 backdrop-blur-sm p-4 flex items-start justify-center">
      <div class="w-full max-w-2xl mt-20 bg-white dark:bg-[#111827] border border-gray-200 dark:border-gray-700 rounded-xl shadow-2xl overflow-hidden">
        <div class="p-3 border-b border-gray-200 dark:border-gray-700">
          <input
            id="global-search-input"
            class="w-full input"
            placeholder="Search jobs, servers, workspaces, settings..."
          />
        </div>
        <div id="global-search-results" class="max-h-[60vh] overflow-auto p-3 text-sm"></div>
        <div class="px-3 py-2 border-t border-gray-200 dark:border-gray-700 text-[11px] text-gray-500 dark:text-gray-400 flex items-center justify-between">
          <span>Use ↑ ↓ to navigate, Enter to open</span>
          <span>Esc to close</span>
        </div>
      </div>
    </div>

    <script src="/vendor/lucide/dist/umd/lucide.min.js"></script>
    <script src="/vendor/cronstrue/dist/cronstrue.min.js"></script>
    <script src="/vendor/xterm/lib/xterm.js"></script>
    <script src="/vendor/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script src="/vendor/xterm-addon-web-links/lib/xterm-addon-web-links.js"></script>
    <script src="/vendor/@xterm/addon-search/lib/addon-search.js"></script>
    <script src="/vendor/monaco-editor/min/vs/loader.js"></script>
    <script src="/vendor/file-icons-js/dist/file-icons.js"></script>
    <script src="/vendor/chart.js/dist/chart.umd.js"></script>
    <div id="gui-context-menu" class="fixed hidden z-[9999] bg-[var(--bg3)] border border-[var(--b)] rounded-lg shadow-2xl overflow-hidden font-sans text-[12.5px] min-w-[180px] select-none text-[var(--t2)] py-1">
      <div data-ctx-action="open" class="px-3 py-1.5 cursor-pointer hover:bg-[var(--bg4)] hover:text-[var(--t)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Open
      </div>
      <div data-ctx-action="chmod" class="px-3 py-1.5 cursor-pointer hover:bg-[var(--bg4)] hover:text-[var(--t)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg> Change Permissions
      </div>
      <div data-ctx-action="rename" class="px-3 py-1.5 cursor-pointer hover:bg-[var(--bg4)] hover:text-[var(--t)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Rename
      </div>
      <div class="h-px bg-[var(--b)] my-1"></div>
      <div data-ctx-action="delete" class="px-3 py-1.5 cursor-pointer hover:bg-[var(--bg4)] text-[var(--er)] flex items-center gap-2">
        <svg class="w-3.5 h-3.5 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> Delete
      </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/cronBuilder.js"></script>
    <script src="/js/pages/workspaces.js"></script>
    <script src="/js/pages/vault.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
